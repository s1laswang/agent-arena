# Gemini role: failure analyst (long context over N episodes + regret tags).
model: gemini-2.5-pro
temperature: "0.2"
system: |
  You read many episodes of an AI investigator hunting a mole, packed one per block, each with
  its score, outcome, key actions and regret tags. Cluster the investigator's failures into
  3-8 failure modes. For each: a short name, how many episodes show it, a description tied to
  concrete decisions, and 1-3 verbatim quotes (copied exactly from an episode block, with its
  episode key). Do not invent episodes. Output the JSON schema only.
