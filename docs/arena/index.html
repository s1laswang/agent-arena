<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canary Arena</title>
<style>
:root{--bg:#0b0f17;--pn:#141a26;--pn2:#1b2332;--ln:#2a3550;--tx:#e6ebf5;--mu:#8b97b3;--yl:#ffd23f;--rd:#ff5a5a;--gn:#4fd6a0;--bl:#4aa3ff;--pu:#b17cff}
*{box-sizing:border-box}
html,body{margin:0;max-width:100vw;overflow-x:hidden;background:var(--bg);color:var(--tx);font:13px/1.4 ui-monospace,Menlo,Consolas,"Courier New",monospace;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:var(--tx);background:var(--pn2);border:2px solid var(--ln);border-radius:4px;padding:6px 10px;cursor:pointer;box-shadow:0 3px 0 #0a0e16;transition:transform .06s,box-shadow .06s,border-color .1s}
button:hover{border-color:var(--yl)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0e16}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--yl);color:#1a1400;border-color:#a8861a;font-weight:700}
button.dng{background:var(--rd);color:#210606;border-color:#a42a2a;font-weight:700}
button.on{border-color:var(--yl);color:var(--yl)}
input[type=text]{font:inherit;color:var(--tx);background:#0d121c;border:2px solid var(--ln);border-radius:4px;padding:6px 8px;min-width:0}
input[type=text]:focus{outline:none;border-color:var(--yl)}
h1,h2,h3{margin:0;letter-spacing:.08em}
#app{max-width:1360px;margin:0 auto;padding:8px 10px 24px;display:flex;flex-direction:column;gap:8px;min-height:100vh}
#top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--pn);border:2px solid var(--ln);border-radius:6px;padding:6px 10px}
#top .logo{color:var(--yl);font-weight:800;letter-spacing:.14em}
.chip{display:inline-block;padding:1px 7px;border-radius:3px;background:var(--pn2);border:1px solid var(--ln);color:var(--mu);font-size:11px}
.vbar{width:140px;height:12px;background:#0a0e16;border:2px solid var(--ln);border-radius:3px;overflow:hidden;position:relative}
.vbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gn),var(--yl));transition:width .5s}
.pips{display:flex;gap:2px}.pips b{width:8px;height:12px;background:var(--yl);border-radius:1px}.pips b.off{background:#2a3144}
#main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:8px;align-items:start}
#left{display:flex;flex-direction:column;gap:8px;min-width:0}
#stage{position:relative;border:2px solid var(--ln);border-radius:6px;overflow:hidden;background:#05070b;line-height:0}
#cv{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.banner{position:absolute;left:8px;top:8px;background:rgba(10,14,22,.85);border:2px solid var(--yl);color:var(--yl);padding:2px 8px;border-radius:4px;font-size:11px;line-height:1.4;letter-spacing:.06em}
.panel{background:var(--pn);border:2px solid var(--ln);border-radius:6px;padding:8px;min-width:0}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{padding:3px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.grid button{text-align:left;padding:5px 8px;font-size:12px}
.grid button small{display:block;color:var(--mu);font-size:10px}
.free{border-style:dashed!important}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.res{background:#0d121c;border:2px solid var(--ln);border-radius:4px;padding:8px;max-height:300px;overflow:auto;margin-top:8px}
.res .l{padding:2px 0;border-bottom:1px dotted #26304a}
.res .l:last-child{border:0}
.mu{color:var(--mu)}.yl{color:var(--yl)}.rd{color:var(--rd)}.gn{color:var(--gn)}.bl{color:var(--bl)}
.tag{display:inline-block;min-width:22px;text-align:center;padding:0 5px;border-radius:3px;font-weight:700;color:#10151f;font-size:11px}
.emp{display:flex;align-items:center;gap:6px;padding:3px 6px;border:2px solid transparent;border-radius:4px;cursor:pointer}
.emp:hover{background:var(--pn2)}.emp.sel{border-color:var(--yl)}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.rost{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px;max-height:340px;overflow:auto}
.gem{display:flex;flex-direction:column;gap:6px;max-height:640px;overflow:auto}
.gstep{border-left:3px solid var(--ln);padding:2px 8px;background:#0d121c;border-radius:0 4px 4px 0}.gstep:last-child{animation:pop .25s ease-out}
.gstep.err{border-color:var(--rd)}
.gday{color:var(--yl);font-weight:800;letter-spacing:.1em;margin-top:6px}
@keyframes pop{from{transform:translateX(10px);opacity:0}to{transform:none;opacity:1}}
#toasts{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none;width:min(92vw,520px)}
.toast{background:#0f1522;border:2px solid var(--yl);padding:8px 12px;border-radius:5px;animation:tin .25s ease-out;text-align:center;font-weight:700}
.toast.bad{border-color:var(--rd);color:var(--rd)}.toast.good{border-color:var(--gn);color:var(--gn)}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.screen{position:fixed;inset:0;z-index:40;background:rgba(7,10,16,.86);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.card{background:var(--pn);border:3px solid var(--ln);border-radius:8px;padding:18px;max-width:880px;width:100%;box-shadow:0 8px 0 #070a10}
.title{font-size:clamp(28px,6vw,54px);font-weight:900;color:var(--yl);letter-spacing:.12em;text-shadow:3px 3px 0 #a8861a,6px 6px 0 #0a0e16;text-align:center}
.sub{color:var(--mu);text-align:center;margin:8px 0 16px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}
.mode{background:var(--pn2);border:3px solid var(--ln);border-radius:6px;padding:12px;cursor:pointer;text-align:left;box-shadow:0 4px 0 #0a0e16;display:block;width:100%}
.mode:hover{border-color:var(--yl);transform:translateY(-2px)}
.mode h3{color:var(--yl);margin-bottom:6px}
.mode p{margin:0;color:var(--mu);font-size:12px}
.seedrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.seedrow button{min-width:54px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}
.cmp>div{background:var(--pn2);border:2px solid var(--ln);border-radius:6px;padding:12px;text-align:center}
.cmp .big{font-size:34px;font-weight:900}
.cmp .win{border-color:var(--gn)}
.src{color:var(--mu);font-size:10px;word-break:break-all}
.bird{display:block;margin:0 auto 6px;image-rendering:pixelated}
.hide{display:none!important}
button.big{min-height:56px;min-width:56px;padding:10px 18px;font-size:16px}
.mode{min-height:84px}.mode h3{font-size:20px;margin-bottom:4px}.mode p{font-size:14px}.mode.pri{background:var(--yl);color:#1a1400}.mode.pri h3,.mode.pri p{color:#1a1400}
.how{font-size:17px;line-height:1.5;margin:10px 0}.how p{margin:8px 0}
table{border-collapse:collapse;width:100%}td,th{padding:2px 6px;text-align:left;border-bottom:1px dotted #26304a;font-weight:400}
.heat{height:6px;background:#0a0e16;border-radius:2px;overflow:hidden;flex:1;min-width:40px}.heat i{display:block;height:100%;background:var(--rd)}
footer{color:#b7c2dc;font-size:12px;text-align:center}
.screen.ttl{background:rgba(7,10,16,.38);align-items:flex-end}.screen.ttl .card{background:rgba(20,26,38,.9);max-width:640px;margin-bottom:6vh}
#top .chip{font-size:12px;color:#c3cde4}
.title,.card,.modes,.mode{min-width:0;max-width:100%}.title{overflow-wrap:anywhere}
@media(max-width:600px){.modes{grid-template-columns:1fr}.card{padding:12px}#top{padding:6px}#top .logo{font-size:12px}.screen{padding:12px 16px}.title{letter-spacing:.06em}.row button.big{flex:1}.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.grid button,.tabs button{min-height:44px;font-size:13px}.res,.gstep,.rost{font-size:13px}.src{display:none}}
@media(max-width:960px){#main{grid-template-columns:minmax(0,1fr)}.gem{max-height:420px}.vbar{width:90px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="logo">CANARY ARENA</span>
    <span class="chip" id="modeChip">menu</span>
    <span id="hud" class="row hide" style="margin:0">
      <span>Day <b id="dayN">1</b>/21</span>
      <span class="vbar" title="company value V"><i id="vfill" style="width:100%"></i></span>
      <b id="vnum">1.00</b>
      <span class="pips" id="pips" title="actions left today"></span>
      <span class="chip" id="clock">09:00</span>
    </span>
    <span style="flex:1"></span>
    <button id="menuBtn" class="hide">Menu</button>
    <button id="lbBtn">Leaderboard</button>
  </div>
  <div id="main">
    <div id="left">
      <div id="stage"><canvas id="cv"></canvas><div class="banner hide" id="banner"></div></div>
      <div class="panel" id="tools"></div>
    </div>
    <div class="panel" id="side"></div>
  </div>
  <footer>Art: Kenney.nl (CC0)</footer>
</div>
<div id="toasts"></div>
<div id="screen" class="screen"></div>
<script src="js/assets.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/office.js"></script>
<script src="js/core_world.js"></script>
<script src="js/feat_talk.js"></script>
<script src="js/feat_desk.js"></script>
<script src="js/feat_carry.js"></script>
<script src="js/solverdata.js"></script>
<script src="js/app.js"></script>
<script src="js/modes.js"></script>
<script>
(function () {
  var sh = null;
  function ready() {
    return sh || Promise.all([window.loadImg(window.AS["tiny-dungeon"]), window.loadImg(window.AS["roguelike-indoor"])]).then(function (im) { sh = im; return im; });
  }
  window.startWalk = function (seed) {
    var seeds = window.AD.index.seeds.map(function (s) { return s.seed; });
    if (seed == null) seed = seeds[Math.floor(Math.random() * seeds.length)];
    ready().then(function (im) {
      document.getElementById("screen").classList.add("hide");
      var W = window.World;
      W.setSheets(im[0], im[1]);
      W.env = new window.Eng.Env(window.AD.world[seed], seed);
      W.onExit = function () { window.arena.title(); };
      W.start(seed);
    });
  };
  var m = /[?&]walk=(\d*)/.exec(location.search);
  if (m) window.addEventListener("load", function () { setTimeout(function () { window.startWalk(m[1] === "" ? null : +m[1]); }, 300); });
})();
</script>
</body>
</html>
