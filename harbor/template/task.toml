schema_version = "1.4"

# Generated by harbor/build.py from harbor/template/task.toml. Do not edit the generated copy.
#
# Integrity design (docs/CONTRACT.md section 4):
# - The Canary MCP server (and the Env, the world secret and the ledger token) lives ONLY in the
#   `canary-server` compose sidecar. The agent container (`main`) has no repo source, no world data,
#   no secret; it reaches the game only over HTTP at http://canary-server:8765/mcp.
# - Grading reads the server-side ledger. After the agent finishes, Harbor stops `main`, runs the
#   collect hook INSIDE the sidecar (it reads the sidecar-only ledger token and GETs /ledger on
#   localhost), copies /evidence/ledger.json out as an artifact, and the separate verifier writes
#   ledger["score"] to /logs/verifier/reward.txt. The agent never holds the token and never touches
#   the verifier sandbox.
artifacts = [
    { source = "/evidence/ledger.json", service = "canary-server", destination = "ledger.json" },
]

[task]
name = "canary/${TASK_ID}"
description = "Find the hidden mole in a simulated company before the leaks drain its value (${TIER} tier)."
keywords = ["investigation", "planning", "mcp", "bayesian"]
authors = [{ name = "Canary team (Junction 2026)" }]

[metadata]
category = "investigation"
difficulty = "${TIER}"
tier = "${TIER}"

[verifier]
timeout_sec = 120.0
environment_mode = "${VERIFIER_MODE}"
${VERIFIER_ENV_LINE}

[[verifier.collect]]
service = "canary-server"
command = "python /opt/canary-server/collect.py"
timeout_sec = 60.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
workdir = "/app"

[[environment.mcp_servers]]
name = "canary"
transport = "streamable-http"
url = "http://canary-server:8765/mcp"
