<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 206" role="img" aria-labelledby="forgeTitle">
  <title id="forgeTitle">Mole Forge: Gemini writes a JSON strategy, regret is scored, the strategy is kept only if the solver still catches the mole, and the hall of fame freezes the hard tier</title>
  <desc>Four steps left to right. A banner states that every hard case stays solvable.</desc>
  <style>
    .box { fill: #101a2c; stroke: #2c4d66; stroke-width: 1.5; }
    .last { fill: #1c1708; stroke: #f5c542; stroke-width: 1.75; }
    .h { font-family: "Liberation Sans", "DejaVu Sans", sans-serif; font-size: 16px; font-weight: 700; fill: #e7eef8; }
    .s { font-family: "Liberation Sans", "DejaVu Sans", sans-serif; font-size: 13px; fill: #93a4bc; }
    .badge { fill: #f5c542; }
    .bn { font-family: "Liberation Sans", "DejaVu Sans", sans-serif; font-size: 12px; font-weight: 700; fill: #1a1404; }
    .note { font-family: "Liberation Sans", "DejaVu Sans", sans-serif; font-size: 15px; font-weight: 700; fill: #f5c542; }
  </style>
  <defs>
    <marker id="forgeArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 z" fill="#5ad0e6"/>
    </marker>
  </defs>
  <g>
    <rect class="box" x="46" y="14" width="230" height="132" rx="12"/>
    <circle class="badge" cx="68" cy="36" r="11"/>
    <text class="bn" x="68" y="40" text-anchor="middle">1</text>
    <text class="h" x="161" y="70" text-anchor="middle">Gemini writes</text>
    <text class="s" x="161" y="92" text-anchor="middle">a safe JSON strategy</text>
    <text class="s" x="161" y="112" text-anchor="middle">leak, go quiet, frame</text>
  </g>
  <g>
    <rect class="box" x="312" y="14" width="230" height="132" rx="12"/>
    <circle class="badge" cx="334" cy="36" r="11"/>
    <text class="bn" x="334" y="40" text-anchor="middle">2</text>
    <text class="h" x="427" y="70" text-anchor="middle">Fitness is regret</text>
    <text class="s" x="427" y="92" text-anchor="middle">solver minus frontier</text>
    <text class="s" x="427" y="112" text-anchor="middle">evolution loop on FR8</text>
  </g>
  <g>
    <rect class="box" x="578" y="14" width="230" height="132" rx="12"/>
    <circle class="badge" cx="600" cy="36" r="11"/>
    <text class="bn" x="600" y="40" text-anchor="middle">3</text>
    <text class="h" x="693" y="70" text-anchor="middle">Keep it only if</text>
    <text class="s" x="693" y="92" text-anchor="middle">our solver still</text>
    <text class="s" x="693" y="112" text-anchor="middle">catches the mole</text>
  </g>
  <g>
    <rect class="last" x="844" y="14" width="230" height="132" rx="12"/>
    <circle class="badge" cx="866" cy="36" r="11"/>
    <text class="bn" x="866" y="40" text-anchor="middle">4</text>
    <text class="h" x="959" y="70" text-anchor="middle">Hall of fame</text>
    <text class="s" x="959" y="92" text-anchor="middle">becomes the frozen</text>
    <text class="s" x="959" y="112" text-anchor="middle">hard tier</text>
  </g>
  <g fill="none" stroke="#5ad0e6" stroke-width="2" marker-end="url(#forgeArrow)">
    <line x1="278" y1="80" x2="304" y2="80"/>
    <line x1="544" y1="80" x2="570" y2="80"/>
    <line x1="810" y1="80" x2="836" y2="80"/>
  </g>
  <text class="note" x="560" y="182" text-anchor="middle">Every hard case stays solvable. The rule language is documented.</text>
</svg>
