[project]
name = "canary"
version = "0.0.1"
description = "Canary: catch the mole. RL environment for AfterQuery Break the Agent (Junction 2026)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
llm = ["openai>=1.40", "google-genai>=1.0"]
dev = ["pytest>=8", "hypothesis>=6.100"]
plot = ["matplotlib>=3.8"]  # results/gap_chart.png (make reproduce skips the PNG without it)
mlx = ["mlx-lm>=0.22; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
